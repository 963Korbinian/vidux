/* ============================ render ============================ */
let locked = false;

function applyTheme(){
  const r = document.documentElement;
  if(DB.settings.theme==="system") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme",DB.settings.theme);
}
function render(){
  /* never data-lang: the global click delegate matches [data-lang], and
     <body> matching it turned every stray tap into a language click that
     replaced the open sheet and threw away what had been typed. */
  document.body.dataset.applang = DB.settings.lang;
  applyTheme();
  if(!biz() || !me()){ renderAuth(); renderFab(); return; }
  if(locked){ authStep = "pin"; renderAuth(); $("#fab").classList.add("hide"); return; }
  renderShell();
  const m = $("#main");
  const s = { home:screenHome, credit:screenCredit, cash:screenCash,
    stock:screenStock, bills:screenBills,
    customer:()=>screenCustomer(view.arg), item:()=>screenItem(view.arg),
    bill:()=>screenBill(view.arg), newbill:screenNewBill }[view.name] || screenHome;
  m.innerHTML = '<div class="screen">'+s()+'</div>';
  renderFab();
}

/* ============================ events ============================ */
document.addEventListener("click",ev=>{
  const el = ev.target.closest("[data-act],[data-go],[data-cust],[data-item],[data-bill],[data-entry],[data-auth],[data-lang],[data-theme],[data-type],[data-pin],[data-biz],[data-member],[data-v],[data-mode]");
  if(!el) return;
  const d = el.dataset;

  /* auth */
  if(d.auth){
    if(d.auth==="phone"){ authStep="phone"; renderAuth(); return; }
    if(d.auth==="otp"){
      authPhone = ($("#a-phone")?.value||"").trim();
      if(authPhone.replace(/\D/g,"").length<9) return toast(t("phone"));
      authStep="otp"; renderAuth(); return;
    }
    if(d.auth==="verify"){
      if(($("#a-otp")?.value||"").replace(/\D/g,"").length<4) return toast(t("otp"));
      DB.settings.loginPhone = authPhone;
      authStep = DB.businesses.length ? "" : "setup";
      if(!DB.businesses.length){ renderAuth(); } else { save(); render(); }
      return;
    }
    if(d.auth==="create"){
      const n = ($("#s-name")?.value||"").trim(), ow = ($("#s-owner")?.value||"").trim();
      if(!n) return toast(t("need_name"));
      const ix = [...($("#s-types")?.children||[])].findIndex(b=>b.getAttribute("aria-pressed")==="true");
      const bz = {id:uid("b"),name:n,typeIx:Math.max(0,ix),phone:authPhone,address:"",
        billPrefix:"B",nextBill:1,ts:Date.now(),day:localDay()};
      DB.businesses.push(bz); DB.activeBizId = bz.id;
      const m = {id:uid("m"),bizId:bz.id,name:ow||n,phone:authPhone,role:"owner",ts:Date.now(),day:localDay()};
      DB.members.push(m); DB.activeMemberId = m.id;
      view = {name:"home"}; commit("shop_created",n); toast(t("saved")); return;
    }
    if(d.auth==="demo"){ seedDemo(); view={name:"home"}; render(); return; }
  }
  if(d.lang){
    DB.settings.lang = d.lang; save();
    if(!biz()||!me()) renderAuth(); else render();
    if(!$("#sheet").classList.contains("hide")) sheetSettings();
    return;
  }
  if(d.theme){ DB.settings.theme = d.theme; save(); applyTheme(); sheetSettings(); return; }
  if(d.mode){ biz().mode = d.mode; commit("shop_mode",d.mode); sheetSettings(); return; }
  if(d.type){ [...el.parentElement.children].forEach(b=>b.setAttribute("aria-pressed",b===el)); return; }
  if(d.pin){
    if(d.pin==="del") pinBuf = pinBuf.slice(0,-1);
    else if(d.pin==="clr") pinBuf = "";
    else if(pinBuf.length<4) pinBuf += d.pin;
    if(pinBuf.length===4){
      if(pinBuf===DB.settings.pin){ locked=false; pinBuf=""; authStep=""; render(); }
      else { pinBuf=""; toast(t("wrong_pin")); renderAuth(); }
      return;
    }
    renderAuth(); return;
  }

  /* navigation */
  if(d.go){ go(d.go); return; }
  if(d.cust){ go("customer",d.cust); return; }
  if(d.item){ go("item",d.item); return; }
  if(d.bill){ go("bill",d.bill); return; }
  if(d.biz){ DB.activeBizId = d.biz;
    const m = members()[0]; DB.activeMemberId = m? m.id : null;
    closeSheet(); view={name:"home"}; commit("switch_shop",biz().name); return; }
  if(d.member){
    /* only ever reachable from the owner's own "change user" picker */
    if(myRole()!=="owner") return;
    DB.activeMemberId = d.member; closeSheet(); view={name:"home"};
    commit("switch_user",me().name); toast(me().name+" · "+t("role_"+myRole())); return;
  }
  if(d.entry){
    const e = DB.entries.find(x=>x.id===d.entry);
    if(e) sheetEntry(e);
    return;
  }

  /* segments */
  if(d.v && el.parentElement.id==="cash-period"){ cashPeriod = d.v; render(); return; }
  if(d.v && el.parentElement.id==="quick-mode"){ quickMode = d.v; render(); return; }
  if(d.v && el.parentElement.id==="bill-method"){ draft.method = d.v; render(); return; }

  switch(d.act){
    case "close": closeSheet(); break;
    case "switch-biz": sheetSwitchBiz(); break;
    case "add-biz": closeSheet(); authStep="setup"; DB.activeBizId=null; DB.activeMemberId=null; render(); break;
    case "team": sheetTeam(); break;
    case "invite": sheetInvite(); break;
    case "change-user": sheetChangeUser(); break;
    case "settings": sheetSettings(); break;
    case "new-cust": sheetNewCust(); break;
    case "give": sheetGive(d.id,false); break;
    case "take": sheetGive(d.id,true); break;
    case "copy-remind": { const c=DB.customers.find(x=>x.id===d.id);
      copy(reminderText(c,custBalance(c.id))); break; }
    case "quick": quickBook(d.id); break;
    case "new-cash": sheetCash(); break;
    case "new-item": sheetItem(null); break;
    case "edit-item": sheetItem(d.id); break;
    case "stockin": sheetStockMove(d.id,false); break;
    case "stockout": sheetStockMove(d.id,true); break;
    case "newbill": draft=null; go("newbill"); break;
    case "add-line": { const i=DB.items.find(x=>x.id===d.id);
      const ex = draft.lines.find(l=>l.itemId===i.id);
      if(ex) ex.qty++; else draft.lines.push({itemId:i.id,name:i.name,qty:1,price:i.price});
      render(); break; }
    case "rm-line": draft.lines.splice(+d.ix,1); render(); break;
    case "save-bill": {
      const c = $("#bill-cust"); if(c) draft.customerId = c.value;
      const ds = $("#bill-disc");
      if(ds){ const dv = parseAmt(ds.value); draft.discount = badAmt(dv) ? 0 : Math.max(0, dv); }
      if(draft.method==="credit" && !draft.customerId){ toast(t("no_cust_p")); break; }
      saveBill(); break; }
    case "copy-bill": copy(billText(DB.invoices.find(x=>x.id===d.id))); break;
    case "copy-csv": copy(csv()); break;
    case "backup-save": backupSave(); break;
    case "backup-load": $("#backup-file")?.click(); break;
    case "ideas": sheetIdeas(); break;
    case "free-ok": DB.settings.freeSeen = true; save(); render(); break;
    case "idea-new": sheetIdeaNew(); break;
    case "idea-vote": voteIdea(d.id); break;
    case "save-biz": { const b=biz();
      b.name = $("#st-name").value.trim()||b.name;
      b.phone = $("#st-phone").value.trim(); b.address = $("#st-addr").value.trim();
      commit("shop_edit",b.name); toast(t("saved")); sheetSettings(); break; }
    case "set-pin": {
      openSheet(t("set_pin"),field(t("lock"),'<input class="inp amt" id="p-pin" inputmode="numeric" maxlength="4" placeholder="····">'),
        '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
        '<button class="btn" id="p-save">'+t("save")+'</button>');
      setTimeout(()=>$("#p-pin")?.focus(),80);
      $("#p-save").onclick = ()=>{ const v=($("#p-pin").value||"").replace(/\D/g,"");
        if(v.length!==4) return toast(t("set_pin"));
        DB.settings.pin = v; closeSheet(); commit("pin_set",""); toast(t("pin_on")); };
      break; }
    case "rm-pin": DB.settings.pin=null; commit("pin_removed",""); toast(t("pin_off")); sheetSettings(); break;
    case "reset": confirmSheet(t("reset_q"),t("reset_d"),t("erase"),()=>{
        DB = blank(); try{ localStorage.removeItem(KEY); }catch(e){}
        authStep="lang"; locked=false; view={name:"home"}; render(); toast(t("erase"));
      },true); break;
  }
});

/* keep the bill draft in sync while typing */
document.addEventListener("change",ev=>{
  if(ev.target.id==="bill-cust" && draft) draft.customerId = ev.target.value;
  if(ev.target.id==="bill-disc" && draft){ const dv = parseAmt(ev.target.value);
    draft.discount = badAmt(dv) ? 0 : Math.max(0, dv); }
});
document.addEventListener("submit",ev=>ev.preventDefault());

/* Zwei offene Tabs schrieben blind uebereinander: der aeltere Tab kannte den
   neuen Stand nicht und machte ihn mit dem naechsten Speichern platt. Jetzt
   hoert jeder Tab zu und uebernimmt, was der andere geschrieben hat. */
window.addEventListener("storage", ev => {
  if(ev.key !== KEY || !ev.newValue) return;
  let p = null;
  try{ p = JSON.parse(ev.newValue); }catch(e){ return; }
  if(!p || p.v !== 1) return;
  DB = Object.assign(blank(), p);
  if(!document.querySelector("#sheet").classList.contains("hide")) closeSheet();
  render();
  toast(t("other_tab"));
});

/* ============================ boot ============================ */
load();
/* Noch nichts gespeichert: direkt in den Beispiel-Shop, ohne Anmeldung.
   Der Anmeldeweg bleibt erhalten — Einstellungen > Alles loeschen holt ihn zurueck. */
if(!biz() || !me()) seedDemo();
authStep = "";
if(DB.settings.pin) locked = true;
/* the language screen also offers the example shop, so the app is never an empty shell */
const origAuth = renderAuth;
renderAuth = function(){
  origAuth();
  if(authStep==="lang"){
    const btn = document.createElement("button");
    btn.className = "btn ghost"; btn.dataset.auth = "demo";
    btn.textContent = "Open the example shop";
    $("#auth").appendChild(btn);
    const p = document.createElement("p");
    p.style.cssText = "font-size:11.5px;color:var(--ink-3);text-align:center;margin:0";
    p.textContent = "Sudu Nelum Stores, Galle — made-up figures, safe to play with.";
    $("#auth").appendChild(p);
  }
};
render();
</script>

<script>
/* ============================ ideas: the improvement loop ============================
   Shop owners write what the book should do next. Suggestions live in the artifact's
   shared store, not in this phone, so they reach whoever maintains the app. Everyone
   sees them and can mark one "useful too" — that vote is the priority signal.
   The app does NOT rewrite itself: a suggestion is read, judged and built, then the
   status here flips to "Done". That loop is deliberate, not automatic. */
let CDB = null, CUSER = null, CAPS = "pending";
(async () => {
  try { CDB = (await window.claude?.use?.("db")) || null; } catch(e) { CDB = null; }
  try { CUSER = (await window.claude?.use?.("user")) || null; } catch(e) { CUSER = null; }
  CAPS = "done";
})();

const DRAFT_KEY = "vidux.idea.draft";
const KINDS = [["bug","kind_bug"],["wish","kind_wish"],["hard","kind_hard"]];
const ST = {new:"st_new", planned:"st_planned", done:"st_done", later:"st_later", no:"st_no"};
let myVotes = null;

function statusPill(st){
  const k = ST[st] || ST.new;
  const tone = st==="done" ? "in" : st==="planned" ? "brand" : st==="no" ? "out" : "";
  return '<span class="pill '+tone+'">'+esc(t(k))+'</span>';
}
function kindPill(kind){
  const row = KINDS.find(k=>k[0]===kind);
  return '<span class="pill">'+esc(t(row ? row[1] : "kind_wish"))+'</span>';
}

async function loadVotes(){
  if(myVotes || !CDB || !CUSER) return myVotes || {ids:[]};
  try{
    const id = await CUSER.id();
    const doc = await CDB.doc("votes/"+id).get();
    myVotes = (doc && doc.data) ? doc.data : {ids:[]};
    if(!Array.isArray(myVotes.ids)) myVotes.ids = [];
  }catch(e){ myVotes = {ids:[]}; }
  return myVotes;
}

function sheetIdeas(){
  openSheet(esc(t("ideas")),
    '<p style="margin:0 0 12px;color:var(--ink-2);font-size:13px">'+esc(t("ideas_d"))+'</p>'+
    '<div id="idea-list"><div class="empty">'+I.bulb+'<p>…</p></div></div>',
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" data-act="idea-new">'+t("idea_new")+'</button>');
  drawIdeas();
}

async function drawIdeas(){
  const box = () => document.querySelector("#idea-list");
  /* the store answers late or never; never block the sheet on it */
  const t0 = Date.now();
  while(CAPS === "pending" && Date.now() - t0 < 10000){ await new Promise(r=>setTimeout(r,120)); }
  if(!box()) return;
  if(!CDB){
    box().innerHTML = '<div class="warn">'+I.warn+' '+esc(t("idea_offline"))+'</div>';
    return;
  }
  let rows = [];
  try{
    const res = await CDB.collection("suggestions").orderBy("votes","desc").limit(40).get();
    rows = (res && res.docs) ? res.docs : [];
  }catch(e){
    if(box()) box().innerHTML = '<div class="warn">'+I.warn+' '+esc(t("idea_offline"))+'</div>';
    return;
  }
  const v = await loadVotes();
  if(!box()) return;
  if(!rows.length){
    box().innerHTML = '<div class="list"><div class="empty">'+I.bulb+
      '<h3>'+esc(t("idea_none"))+'</h3><p>'+esc(t("idea_none_p"))+'</p></div></div>';
    return;
  }
  box().innerHTML = '<div class="list">'+rows.map(r=>{
    const d = r.data || {};
    const voted = v.ids.includes(r.id);
    return '<div class="row" style="align-items:flex-start">'+
      '<span class="row-main"><span class="row-t" style="white-space:normal">'+esc(d.text||"")+'</span>'+
      '<span class="row-s" style="white-space:normal;margin-top:5px">'+kindPill(d.kind)+' '+statusPill(d.status)+'</span></span>'+
      '<span class="row-end"><button class="btn '+(voted?"soft":"ghost")+' sm" data-act="idea-vote" data-id="'+esc(r.id)+'"'+
        (voted?' disabled':'')+'>'+(d.votes||0)+' ★</button></span></div>';
  }).join("")+'</div>';
}

function sheetIdeaNew(){
  let kind = "wish";
  let draft = "";
  try{ draft = localStorage.getItem(DRAFT_KEY) || ""; }catch(e){}
  openSheet(esc(t("idea_new")),
    '<span class="f-l">'+t("idea_kind")+'</span><div class="chips" id="idea-kinds">'+
      KINDS.map(([v,k])=>'<button class="chip" data-kind="'+v+'" aria-pressed="'+(v===kind)+'">'+esc(t(k))+'</button>').join("")+
    '</div><div style="height:14px"></div>'+
    field(t("idea_text"),'<textarea class="inp" id="idea-text" rows="4" placeholder="—">'+esc(draft)+'</textarea>'),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" id="idea-save">'+t("idea_send")+'</button>');
  setTimeout(()=>document.querySelector("#idea-text")?.focus(),80);
  document.querySelector("#idea-kinds").onclick = ev=>{
    const b = ev.target.closest("[data-kind]"); if(!b) return;
    kind = b.dataset.kind;
    [...document.querySelector("#idea-kinds").children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.kind===kind));
  };
  document.querySelector("#idea-save").onclick = async () => {
    const el = document.querySelector("#idea-text");
    const text = (el?.value || "").trim();
    if(text.length < 3) return toast(t("idea_need_text"));
    try{ localStorage.setItem(DRAFT_KEY, text); }catch(e){}
    if(!CDB){ toast(t("idea_offline")); return; }
    const btn = document.querySelector("#idea-save");
    btn.disabled = true;                      /* no double send on a slow line */
    try{
      await CDB.collection("suggestions").doc(uid("s")).set({
        text: text.slice(0,600), kind, status:"new", votes:0,
        lang: DB.settings.lang, shopType: biz()?.typeIx ?? null,
        created: new Date().toISOString()
      });
      try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
      closeSheet(); toast(t("idea_thanks"));
    }catch(e){
      btn.disabled = false; toast(t("idea_offline"));
    }
  };
}

async function voteIdea(id){
  if(!CDB || !CUSER) return toast(t("idea_offline"));
  const v = await loadVotes();
  if(v.ids.includes(id)) return;
  try{
    const ref = CDB.collection("suggestions").doc(id);
    const cur = await ref.get();
    const n = ((cur && cur.data && cur.data.votes) || 0) + 1;
    await ref.update({votes: n});
    v.ids.push(id);
    const me = await CUSER.id();
    await CDB.doc("votes/"+me).set({ids: v.ids});
    drawIdeas();
  }catch(e){ toast(t("idea_offline")); }
}
</script>

<script>
/* ============================ one-tap takings ============================
   A barber charges 500 for a haircut and 200 for a shave; a tuition class
   charges one fee; a three-wheel ride has a flat price. For them the whole
   app is this strip: tap the price, the money is booked. A kade uses the
   same strip for whatever sells all day. */
function quickBook(id){
  const it = DB.items.find(x=>x.id===id);
  if(!it || !canWrite()) return;
  if(quickMode === "credit"){ pickCustomerFor(it); return; }
  addEntry({kind:"cash_in", amount:it.price, category:"cat_sales",
            itemId:it.id, note:it.name, acct:"cash"});
  if(isTracked(it)) addEntry({kind:"stock_out", qty:1, itemId:it.id, note:it.name});
  commit("quick_sale", it.name+" "+money(it.price));
  toast(t("quick_booked")+" · "+money(it.price));
}

function pickCustomerFor(it){
  const cs = customers();
  openSheet(esc(t("pick_customer"))+' · '+esc(money(it.price)),
    cs.length
      ? '<div class="list">'+cs.map(c=>
          '<button class="row" data-qcust="'+c.id+'"><span class="av">'+esc(initials(c.name))+'</span>'+
          '<span class="row-main"><span class="row-t">'+esc(c.name)+'</span>'+
          '<span class="row-s">'+esc(c.phone||"")+'</span></span>'+
          '<span class="row-end"><span class="row-amt owed">'+esc(money(custBalance(c.id)))+'</span></span></button>').join("")+'</div>'
      : emptyBox(I.credit,t("no_cust"),t("no_cust_p")),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn soft" data-act="new-cust">'+t("new_customer")+'</button>');
  $("#sheet-body").onclick = ev => {
    const b = ev.target.closest("[data-qcust]"); if(!b) return;
    addEntry({kind:"credit_give", amount:it.price, customerId:b.dataset.qcust,
              itemId:it.id, note:it.name});
    if(isTracked(it)) addEntry({kind:"stock_out", qty:1, itemId:it.id, note:it.name});
    closeSheet();
    commit("quick_credit", it.name+" "+money(it.price));
    toast(t("quick_booked")+" · "+money(it.price));
  };
}
</script>

<script>
/* ============================ entry detail ============================
   A tap on a line used to open the correction dialog straight away, so reading
   the book and undoing it were the same gesture. Now a tap shows what the line
   says — named, with the amount — and correcting it is a separate, deliberate step. */
function sheetEntry(e){
  const c = e.customerId ? DB.customers.find(x=>x.id===e.customerId) : null;
  const it = e.itemId ? DB.items.find(i=>i.id===e.itemId) : null;
  const mem = DB.members.find(m=>m.id===e.byMemberId);
  const inv = e.invoiceId ? DB.invoices.find(v=>v.id===e.invoiceId) : null;
  const kindTxt = { credit_give:t("give_credit"), credit_take:t("take_payment"),
    cash_in:t("money_in"), cash_out:t("money_out"),
    stock_in:t("stock_in"), stock_out:t("stock_out") }[e.kind] || e.kind;
  const amount = (e.kind==="stock_in"||e.kind==="stock_out")
    ? e.qty+" "+(it?.unit||t("pcs")) : money(e.amount);
  const rows = [
    [kindTxt, amount],
    [t("today"), dayLabel(e.day,DB.settings.lang)+" "+timeLabel(e.ts, e)],
    c ? [t("customers"), c.name] : null,
    it ? [t("item"), it.name] : null,
    e.category ? [t("category"), t(e.category)] : null,
    inv ? [t("bill_no"), inv.no] : null,
    e.note ? [t("note"), e.note] : null,
    mem ? [t("by"), mem.name+" · "+t("role_"+mem.role)] : null
  ].filter(Boolean);

  const done = !!e.reversedBy;
  openSheet(esc(t("entry")),
    '<div class="list" style="padding:4px 13px">'+rows.map(([k,v])=>
      '<div class="audit"><b style="min-width:92px">'+esc(k)+'</b><span>'+esc(v)+'</span></div>').join("")+'</div>'+
    (done ? '<div class="note" style="margin-top:12px">'+esc(t("corrected"))+'</div>'
          : '<p style="font-size:12.5px;color:var(--ink-3);margin:12px 0 0">'+esc(t("correct_d"))+'</p>'),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    (canWrite() && !done
      ? '<button class="btn danger" id="e-correct">'+esc(t("correct"))+'</button>' : ''));
  const btn = document.querySelector("#e-correct");
  if(btn) btn.onclick = ()=>{
    /* name the money before undoing it — the old dialog named nothing */
    confirmSheet(t("correct_this"),
      kindTxt+" · "+amount+(c?" · "+c.name:"")+(it?" · "+it.name:""),
      t("correct"), ()=>reverse(e.id), true);
  };
}

/* The owner hands the phone over on purpose, never by brushing a list row. */
function sheetChangeUser(){
  if(myRole()!=="owner") return;
  openSheet(esc(t("change_user")),
    '<p style="margin:0 0 12px;color:var(--ink-2);font-size:13px">'+esc(t("change_user_d"))+'</p>'+
    '<div class="list">'+members().map(m=>
      '<button class="row" data-member="'+m.id+'"><span class="av">'+esc(initials(m.name))+'</span>'+
      '<span class="row-main"><span class="row-t">'+esc(m.name)+'</span>'+
      '<span class="row-s">'+esc(t("role_"+m.role))+'</span></span>'+
      (m.id===DB.activeMemberId?'<span class="pill brand">'+esc(t("today"))+'</span>':'')+
      '</button>').join("")+'</div>',
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>');
}
</script>

<script>
/* ============================ keep a copy ============================
   Everything lives in this phone's browser storage. Clear the site data,
   change phone or drop it in the canal and the book is gone. This is the
   only way back, and it is the thing shop owners ask Shopbook for most. */
function backupBlob(){
  return JSON.stringify({vidux:1, potha:1, v:DB.v, saved:new Date().toISOString(), db:DB}, null, 1);
}
async function backupSave(){
  const name = "vidux-" + (biz()?.name || "book").replace(/[^A-Za-z0-9]+/g,"-").toLowerCase()
    + "-" + localDay() + ".json";
  const dl = await (window.claude?.use?.("downloads").catch(()=>null) || Promise.resolve(null));
  if(dl){
    try{ await dl.save({filename:name, data:backupBlob()}); toast(t("backup_ok")); return; }
    catch(e){ /* the viewer said no, or it is not available: fall through */ }
  }
  /* no file route: hand the text over so it can be pasted somewhere safe */
  copy(backupBlob(), t("backup_ok"));
}
document.addEventListener("change", ev=>{
  if(ev.target.id !== "backup-file") return;
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onerror = ()=> toast(t("backup_bad"));
  r.onload = ()=>{
    let p;
    try{ p = JSON.parse(String(r.result)); }catch(e){ return toast(t("backup_bad")); }
    const d = p && p.db;
    if(!p || (p.vidux !== 1 && p.potha !== 1) || !d || !Array.isArray(d.businesses) || !Array.isArray(d.entries))
      return toast(t("backup_bad"));
    confirmSheet(t("backup_load"), t("backup_warn"), t("backup_load"), ()=>{
      DB = Object.assign(blank(), d);
      locked = false; view = {name:"home"};
      save(); log("backup_restored", p.saved || "");
      save(); render(); toast(t("saved"));
    }, true);
  };
  r.readAsText(f);
});
</script>

<script>
/* Der Service Worker ist der Unterschied zwischen "die Daten liegen offline"
   und "die App geht offline auf". Ohne ihn zeigt ein Neustart ohne Netz eine
   leere Seite, waehrend das Buch unerreichbar im Speicher liegt. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
