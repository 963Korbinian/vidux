<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vidux Shop Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A0A3E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: mobile-first ledger. Sticky bar on top, tab bar at the bottom,
   every screen opens with one big number that answers one question. */
/* HUBIX palette, locked: dark purple chrome, light content, orange for action,
   teal for "yes, done", red reserved for errors. Inter for words, JetBrains Mono
   for every figure. POTHA is a HUBIX book, so it wears the HUBIX coat. */
:root{
  --purple:#2D1060; --purple-deep:#1A0A3E;
  --head:linear-gradient(135deg,#1A0A3E,#2D1060,#1A0A3E);
  --cta:#FF9F1C; --cta-ink:#1A1033;
  --teal:#00D4BC; --teal-ink:#00A89A;
  --paper:#F7F4FF; --card:#FFFFFF; --sunk:#F0EDFA; --line:#E4DEF4;
  --ink:#1A1033; --ink-2:#7C7491; --ink-3:#9CA3AF;
  --brand:#2D1060; --brand-soft:#EFE9FF; --brand-ink:#2D1060;
  --owed:#C86A00; --owed-soft:#FFF1DC;
  --in:#00A89A;   --in-soft:#E0F7F4;
  --out:#D92D20;  --out-soft:#FDE7E5;
  --gold:#FF9F1C;
  --shadow:0 1px 2px rgba(26,16,51,.06),0 6px 18px -12px rgba(26,16,51,.3);
  --font-display:"Inter",system-ui,-apple-system,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,monospace;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F0A1E; --card:#19122E; --sunk:#241A3F; --line:#332653;
  --ink:#EDE9F8; --ink-2:#A79FC2; --ink-3:#7C7491;
  --brand:#C9B6FF; --brand-soft:#2A1B4D; --brand-ink:#D9CCFF;
  --owed:#FFB04A; --owed-soft:#3A2510;
  --in:#2FE0C9;   --in-soft:#0C3A35;
  --out:#FF7B6E;  --out-soft:#3B1613;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px -14px rgba(0,0,0,.85);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F0A1E; --card:#19122E; --sunk:#241A3F; --line:#332653;
  --ink:#EDE9F8; --ink-2:#A79FC2; --ink-3:#7C7491;
  --brand:#C9B6FF; --brand-soft:#2A1B4D; --brand-ink:#D9CCFF;
  --owed:#FFB04A; --owed-soft:#3A2510;
  --in:#2FE0C9;   --in-soft:#0C3A35;
  --out:#FF7B6E;  --out-soft:#3B1613;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px -14px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body[data-applang="si"]{font-family:"Noto Sans Sinhala",var(--font-body)}
body[data-applang="ta"]{font-family:"Noto Sans Tamil",var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:40;background:#1A0A3E}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hide{display:none!important}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;
  background:var(--paper);position:relative}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);
  border-bottom:0;display:flex;align-items:center;gap:10px;
  padding-block:10px;min-height:56px;color:#fff}
.biz{display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-align:left}
.biz-mark{width:34px;height:34px;border-radius:10px;background:var(--cta);color:#1A1033;
  display:grid;place-items:center;font-family:var(--font-display);font-weight:800;
  font-size:15px;flex:none}
.biz-name{display:block;font-family:var(--font-display);font-weight:700;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz-sub{display:block;font-size:11.5px;color:rgba(255,255,255,.62);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;
  color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk)}
.topbar .icon-btn{color:rgba(255,255,255,.8)}
.topbar .icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 108px}
.screen{display:flex;flex-direction:column;gap:14px}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--head);
  border-top:0;display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));
  padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 10px;color:rgba(255,255,255,.58);font-size:11px;font-weight:500;min-height:58px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--teal)}
.tab[aria-current="page"] .tab-dot{opacity:1}
.tab-dot{width:16px;height:2.5px;border-radius:2px;background:currentColor;opacity:0;
  transition:opacity .15s}

/* ---------- pieces ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow)}
.hero-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:600}
.hero-num{font-family:var(--font-num);font-weight:600;font-size:34px;line-height:1.05;
  letter-spacing:-.03em;margin-top:6px;word-break:break-all}
.hero-num small{font-size:16px;font-weight:500;color:var(--ink-3);margin-right:5px}
.hero-note{font-size:12.5px;color:var(--ink-2);margin-top:7px}
.hero.owed .hero-num{color:var(--owed)} .hero.in .hero-num{color:var(--in)}
.hero.out .hero-num{color:var(--out)} .hero.brand .hero-num{color:var(--brand)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px}
.stat-k{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat-v{font-family:var(--font-num);font-weight:600;font-size:19px;margin-top:3px;
  letter-spacing:-.02em;word-break:break-all}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin-top:4px}
.sec-head h2{font-size:15.5px;font-weight:700}
.sec-head .link{font-size:12.5px;color:var(--brand);font-weight:600}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px;width:100%;text-align:left;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.av{width:36px;height:36px;border-radius:50%;background:var(--sunk);color:var(--ink-2);
  display:grid;place-items:center;font-weight:600;font-size:13.5px;flex:none;
  font-family:var(--font-display)}
.row-main{flex:1;min-width:0}
.row-t{display:block;font-weight:500;font-size:14.5px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{display:block;font-size:12px;color:var(--ink-3);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex:none;max-width:44%}
.row-amt{display:block;font-family:var(--font-num);font-weight:600;font-size:14.5px;
  letter-spacing:-.02em;white-space:nowrap}
.row-amt.owed{color:var(--owed)} .row-amt.in{color:var(--in)} .row-amt.out{color:var(--out)}
.row-sub{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
  padding:2.5px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--sunk);color:var(--ink-2)}
.pill.owed{background:var(--owed-soft);color:var(--owed)}
.pill.in{background:var(--in-soft);color:var(--in)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}

a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14.5px;
  background:var(--cta);color:var(--cta-ink);width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.sm{min-height:40px;font-size:13.5px;padding:0 13px;width:auto}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.btn-row{display:flex;gap:9px}
.btn-row .btn{flex:1;width:auto}

.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;
  right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));
  height:52px;padding:0 20px;border-radius:26px;background:var(--cta);color:var(--cta-ink);
  font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 8px 22px -8px rgba(255,159,28,.55)}
@media(min-width:592px){.fab{right:calc(50% - 280px + 16px)}}
.fab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

label.f{display:block;margin-bottom:12px}
.f-l{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px;display:block}
.inp{width:100%;min-height:48px;padding:10px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);outline:none}
.inp:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:76px;resize:vertical}
.inp.amt{font-family:var(--font-num);font-size:24px;font-weight:600;text-align:right;
  letter-spacing:-.02em}
.seg{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--purple);color:#fff;border-color:var(--purple)}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:66px;
  padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);
  text-align:left}
.qbtn:active{background:var(--brand-soft);border-color:var(--brand)}
.qbtn span{font-size:13.5px;font-weight:500;line-height:1.25;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn b{font-family:var(--font-num);font-size:19px;font-weight:600;color:var(--brand);
  letter-spacing:-.02em}

.promise{background:var(--head);color:#fff;border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow)}
.promise h3{font-size:16px;font-weight:800;color:var(--cta);letter-spacing:-.01em}
.promise p{margin:7px 0 0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.82)}
.promise p.langs{color:var(--teal);font-weight:600;font-size:12.5px}
.promise .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}

.empty{text-align:center;padding:30px 18px;color:var(--ink-3)}
.empty svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:9px;opacity:.7}
.empty h3{font-size:15px;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:13px;margin:0 auto;max-width:30ch}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:50;opacity:0;
  transition:opacity .18s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-width:560px;margin:0 auto;max-height:92%;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:16px;font-weight:700;flex:1}
.sheet-body{overflow-y:auto;padding:14px 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--line);
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:9px}
.sheet-foot .btn{flex:1;width:auto}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:11px;
  font-size:13.5px;font-weight:500;opacity:0;transition:all .2s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* bill */
.bill{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px}
.bill-top{text-align:center;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.bill-top h3{font-family:var(--font-display);font-size:17px;font-weight:800}
.bill-top p{font-size:11.5px;color:var(--ink-3);margin:3px 0 0}
.bill-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;
  color:var(--ink-2);padding:10px 0;border-bottom:1px dashed var(--line)}
.bill-line{display:flex;gap:10px;padding:7px 0;font-size:13.5px;align-items:flex-start}
.bill-line .q{font-family:var(--font-num);color:var(--ink-3);flex:none;min-width:46px}
.bill-line .n{flex:1;min-width:0}
.bill-line .p{font-family:var(--font-num);flex:none;font-variant-numeric:tabular-nums}
.bill-sum{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.bill-sum div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2.5px 0}
.bill-sum .tot{font-family:var(--font-display);font-weight:800;font-size:18px;
  padding-top:7px;margin-top:5px;border-top:1px solid var(--line)}
.bill-foot{text-align:center;font-size:11px;color:var(--ink-3);margin-top:13px;
  padding-top:11px;border-top:1px dashed var(--line)}

.audit{font-size:12px;color:var(--ink-3);display:flex;gap:7px;padding:8px 0;
  border-bottom:1px solid var(--line)}
.audit:last-child{border-bottom:0}
.audit b{color:var(--ink-2);font-weight:600}
.code{font-family:var(--font-num);font-size:11.5px;background:var(--sunk);padding:10px;
  border-radius:9px;white-space:pre-wrap;word-break:break-all;max-height:190px;overflow:auto;
  color:var(--ink-2)}
.note,.warn{border-radius:var(--r-s);padding:11px 13px;font-size:12.5px;
  display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.note{background:var(--brand-soft);color:var(--brand-ink)}
.warn{background:var(--owed-soft);color:var(--owed)}
.note svg,.warn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* auth */
/* Scrollbar, sonst schiebt die Bildschirmtastatur den Weiter-Knopf unter den
   Rand und der Schritt ist nicht abschliessbar. "safe center" haelt den Inhalt
   oben fest, sobald er hoeher ist als der Kasten. */
.auth{display:flex;flex-direction:column;justify-content:safe center;
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  gap:18px;padding-block:28px;max-width:420px;margin:0 auto;width:100%}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:46px;height:46px;border-radius:13px;background:var(--head);color:var(--cta);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:21px}
.brand-a{color:var(--teal)}
.byline{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin-top:3px}
.byline b{color:var(--ink-2);font-weight:800;letter-spacing:.06em}
.byline b i{color:var(--teal-ink);font-style:normal}
.logo-txt h1{font-family:var(--font-display);font-size:25px;font-weight:800;letter-spacing:-.03em}
.logo-txt p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
.lang-row{display:flex;gap:7px}
.pin-dots{display:flex;gap:11px;justify-content:center;margin:6px 0 14px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.8px solid var(--line)}
.pin-dot.on{background:var(--brand);border-color:var(--brand)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{min-height:56px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-family:var(--font-num);font-size:21px;font-weight:500}
.keypad button:active{background:var(--sunk)}
</style>

<div id="app">
  <div id="auth" class="auth gut"></div>
  <header class="topbar gut hide" id="topbar"></header>
  <main class="gut hide" id="main"></main>
  <nav class="tabbar hide" id="tabbar"><div class="tabbar-in" id="tabbar-in"></div></nav>
  <button class="fab hide" id="fab"></button>
</div>
<div class="scrim hide" id="scrim"></div>
<div class="sheet hide" id="sheet">
  <div class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button class="icon-btn" id="sheet-x" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot hide" id="sheet-foot"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================ i18n ============================ */
const T = {
  en:{
    tagline:"Your shop's book",
    pick_lang:"Language", start:"Continue", phone:"Phone number",
    phone_hint:"Your number is the login. No password, no e-mail.",
    otp:"Verification code", otp_hint:"Demo build: type any 4 digits.",
    verify:"Verify", welcome:"Let's set up your shop", biz_name:"Shop name",
    biz_type:"What kind of shop?", owner_name:"Your name", create:"Create my book",
    types:["Grocery","Hardware","Mobile shop","Pharmacy","Bakery","Agri inputs","Garage","Other",

<script>
/* ============================ store ============================ */
const KEY = "vidux.v1";
const KEY_OLD = "potha.v1";   /* the name changed; nobody's book may be lost over it */
const $ = (s,r=document)=>r.querySelector(s);
const uid = p => p+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

/* Local calendar day, frozen at write time. Shopbook's reported bug is a
   transaction jumping from the 10th to the 11th: that happens when the day is
   recomputed from a UTC timestamp later. We store the day once and never redo it. */
function localDay(d=new Date()){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function dayLabel(day,lang){
  const [y,m,dd] = day.split("-").map(Number);
  const d = new Date(y,m-1,dd);
  const loc = lang==="si"?"si-LK":lang==="ta"?"ta-LK":"en-GB";
  try{ return d.toLocaleDateString(loc,{day:"numeric",month:"short"}); }
  catch(e){ return day; }
}
function timeLabel(ts, e){
  if(e && e.hm) return e.hm;      /* beim Schreiben festgehalten, wie der Tag */
  const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return p(d.getHours())+":"+p(d.getMinutes());
}

const blank = () => ({
  v:1, businesses:[], activeBizId:null, members:[], activeMemberId:null,
  customers:[], items:[], entries:[], invoices:[], audit:[],
  settings:{ lang:"en", theme:"system", pin:null, loginPhone:null }
});

let DB = blank();

let loadState = "empty";   /* empty | ok | broken | blocked */
let saveBroken = false;
function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(KEY);
    /* carried over from the POTHA name, once */
    if(!raw){
      const old = localStorage.getItem(KEY_OLD);
      if(old){ raw = old; localStorage.setItem(KEY, old); localStorage.removeItem(KEY_OLD); }
    }
  }
  catch(e){ loadState = "blocked"; return; }
  if(!raw){ loadState = "empty"; return; }
  let p = null;
  try{ p = JSON.parse(raw); }catch(e){ p = null; }
  if(p && p.v === 1){ DB = Object.assign(blank(), p); loadState = "ok"; return; }
  /* A record we cannot read is still the shop's book. Put it aside under its
     own key and refuse to boot the example over it — a future format or one
     half-finished write must never cost somebody their ledger. */
  try{ localStorage.setItem(KEY + ".unreadable." + Date.now(), raw); }catch(e){}
  loadState = "broken";
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); saveBroken = false; return true; }
  catch(e){ saveBroken = true; return false; }   /* the caller must say so out loud */
}
function L(){ return T[DB.settings.lang] || T.en; }
function t(k){ const v = L()[k]; return v===undefined ? (T.en[k]??k) : v; }

/* every write goes through here, so the audit log can never fall behind */
function log(action,detail){
  DB.audit.unshift({id:uid("a"),bizId:DB.activeBizId,ts:Date.now(),day:localDay(),
    memberId:DB.activeMemberId,action,detail});
  if(DB.audit.length>400) DB.audit.length = 400;
}
function commit(action,detail){
  log(action,detail);
  const ok = save();
  render();
  if(!ok) toast(t("not_saved"));
  return ok;
}

const biz = () => DB.businesses.find(b=>b.id===DB.activeBizId) || null;
const me  = () => DB.members.find(m=>m.id===DB.activeMemberId) || null;
const myRole = () => (me()?.role) || "owner";
const canWrite = () => myRole()!=="accountant";
const seesAll  = () => myRole()!=="counter";

const mine = arr => arr.filter(x=>x.bizId===DB.activeBizId);
const entriesAll = () => mine(DB.entries).sort((a,b)=>b.ts-a.ts);
/* "Nur heute" hiess: um Mitternacht war die halbe Abendschicht weg, mitten im
   Dienst. Der Tresen sieht jetzt den heutigen Tag plus das, was er selbst in
   den letzten zwoelf Stunden gebucht hat. */
const entriesVisible = () => {
  const all = entriesAll();
  if(seesAll()) return all;
  const today = localDay(), since = Date.now() - 12*60*60*1000;
  return all.filter(e => e.day === today ||
    (e.byMemberId === DB.activeMemberId && e.ts >= since));
};
const customers = () => mine(DB.customers);
const items = () => mine(DB.items);
const invoices = () => mine(DB.invoices).sort((a,b)=>b.ts-a.ts);
const members = () => DB.members.filter(m=>m.bizId===DB.activeBizId);

/* ---------- money ---------- */
function money(n,opts={}){
  const neg = n<0; const v = Math.abs(Math.round(n));
  const s = v.toLocaleString("en-US");
  return (neg?"−":"")+(opts.bare?"":"Rs ")+s;
}
/* "1e21" wurde zu 121, "1.2.3" zu 1.2 — ein Tippfehler wurde still zu einer
   anderen Zahl gebucht. Jetzt zaehlt nur, was wie ein Betrag aussieht. */
function parseAmt(s){
  const raw = String(s ?? "").trim().replace(/[\s,']/g, "");
  if(raw === "") return 0;
  if(!/^-?\d+(\.\d+)?$/.test(raw)) return NaN;      /* der Aufrufer faengt es ab */
  const n = parseFloat(raw);
  return isFinite(n) ? n : NaN;
}
const badAmt = v => !isFinite(v) || isNaN(v);

/* ---------- derived ---------- */
function custBalance(cid){
  return mine(DB.entries).filter(e=>e.customerId===cid)
    .reduce((s,e)=> s + (e.kind==="credit_give" ? e.amount : e.kind==="credit_take" ? -e.amount : 0), 0);
}
const totalOwed = () => customers().reduce((s,c)=>s+Math.max(0,custBalance(c.id)),0);

/* QR and card money is in a bank, not in the drawer. Counting it as
   "cash in hand" means the number never matches what the owner counts at
   closing, and an owner who cannot reconcile stops trusting the book. */
const acctOf = e => e.acct || (e.method==="qr" || e.method==="card" ? "bank" : "cash");
function cashFlow(filter, acct){
  let inn=0,out=0;
  for(const e of mine(DB.entries)){
    if(filter && !filter(e)) continue;
    const a = acctOf(e);
    if(acct && e.kind!=="transfer" && a!==acct) continue;
    if(e.kind==="cash_in") inn+=e.amount;
    if(e.kind==="cash_out") out+=e.amount;
    /* a deposit leaves the drawer and lands in the bank */
    if(e.kind==="transfer" && acct==="cash") out+=e.amount;
    if(e.kind==="transfer" && acct==="bank") inn+=e.amount;
  }
  return {in:inn,out:out,net:inn-out};
}
const cashInHand = () => cashFlow(null,"cash").net;
const bankBalance = () => cashFlow(null,"bank").net;

function daysBack(n){
  const out=[]; const d=new Date();
  for(let i=0;i<n;i++){ out.push(localDay(d)); d.setDate(d.getDate()-1); }
  return out;
}
/* Ein Ladenbesitzer liest "Monat" als den laufenden Kalendermonat und "Woche"
   als Montag bis heute. Rollende 7- und 30-Tage-Fenster mischten vier Wochen
   Oktober in das, was auf dem Schirm November hiess. */
function daysOfPeriod(period){
  const out = []; const now = new Date();
  if(period === "day") return [localDay(now)];
  const d = new Date(now);
  if(period === "week"){
    const back = (d.getDay() + 6) % 7;        /* Montag = 0 */
    d.setDate(d.getDate() - back);
  } else {
    d.setDate(1);
  }
  while(d <= now){ out.push(localDay(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function rangeDays(period){ return daysOfPeriod(period); }
/* A corrected entry is not a sale, and neither is the line that corrects it.
   Counting either left the sales figure and the cash book disagreeing for good. */
const live = e => !e.reverses && !e.reversedBy;
function salesIn(days){
  const set = new Set(days);
  return mine(DB.entries).filter(e=>live(e) && set.has(e.day) &&
      ((e.kind==="cash_in" && e.category==="cat_sales") ||
       (e.kind==="credit_give" && e.invoiceId)))
    .reduce((s,e)=>s+e.amount,0);
}
function itemQty(id){
  return mine(DB.entries).filter(e=>e.itemId===id)
    .reduce((s,e)=> s + (e.kind==="stock_in" ? e.qty : e.kind==="stock_out" ? -e.qty : 0), 0);
}
/* A barber, a tailor, a tuition class and a three-wheel driver have no shelf.
   They take money at a fixed price. The type picked at setup decides the default,
   and Settings can override it; each item can still say otherwise. */
const SVC = [8,9,10,11,12,13,14];
const isService = () => { const b = biz(); if(!b) return false;
  return b.mode ? b.mode === "service" : SVC.includes(b.typeIx || 0); };
const isTracked = i => (i.tracked === undefined ? !isService() : !!i.tracked);
const stockItems = () => items().filter(isTracked);
const quickItems = () => items().filter(i => i.quick);

const lowItems = () => stockItems().filter(i=>itemQty(i.id) <= (i.lowAt??0));
/* A count below zero means someone mistyped, not that the shelf owes money.
   Show the negative count on the item, but never let it eat the stock value. */
const stockValue = () => stockItems().reduce((s,i)=>s+Math.max(0,itemQty(i.id))*(i.cost||0),0);

function soldQty(id,days){
  const set = days?new Set(days):null;
  /* Undoing a mistyped stock-in writes a stock-out. That is a correction,
     not a hundred sales. */
  return mine(DB.entries).filter(e=>e.itemId===id && e.kind==="stock_out" &&
      live(e) && (!set||set.has(e.day)))
    .reduce((s,e)=>s+e.qty,0);
}
function profitIn(days){
  const set = new Set(days); let p=0;
  for(const inv of mine(DB.invoices)){
    if(!set.has(inv.day)) continue;
    let sub=0, gross=0;
    for(const ln of inv.lines){
      const it = DB.items.find(i=>i.id===ln.itemId);
      /* the cost captured when the bill was made, so last week's profit does
         not move every time a supplier changes a price */
      const cost = (ln.cost !== undefined) ? ln.cost : (it?.cost||0);
      sub += ln.price * ln.qty;
      gross += (ln.price - cost) * ln.qty;
    }
    /* the bill never charges less than nothing, so the discount cannot
       subtract more than the bill was worth */
    p += gross - Math.min(inv.discount||0, sub);
  }
  /* One-tap sales never become a bill, but they do name their item, so
     they carry a cost basis too. A plain cash entry does not — which is
     why the figure is labelled "on bills and quick prices", not "profit". */
  for(const e of mine(DB.entries)){
    if(!set.has(e.day) || e.invoiceId) continue;
    if(e.kind !== "cash_in" && e.kind !== "credit_give") continue;
    if(!e.itemId) continue;
    const it = DB.items.find(i=>i.id===e.itemId);
    if(it) p += (e.amount - (it.cost||0));
  }
  return p;
}

/* ---------- writes ---------- */
function addEntry(o){
  const e = Object.assign({ id:uid("e"), bizId:DB.activeBizId, ts:Date.now(),
    day:localDay(), byMemberId:DB.activeMemberId }, o);
  /* Round once, here. Rounding only on screen made two 50-cent rows read
     "Rs 1" each while the balance moved by one rupee. */
  if(typeof e.amount === "number") e.amount = Math.round(e.amount);
  const _d = new Date(e.ts), _p = x => String(x).padStart(2,"0");
  e.hm = _p(_d.getHours())+":"+_p(_d.getMinutes());
  DB.entries.push(e);
  return e;
}
const OPPOSITE = { credit_give:"credit_take", credit_take:"credit_give",
  cash_in:"cash_out", cash_out:"cash_in", stock_in:"stock_out", stock_out:"stock_in" };
/* A correction is written as its own opposite line. Nothing is ever overwritten,
   so the balance stays arithmetic and the audit log stays honest. */
function reverse(id){
  const e = DB.entries.find(x=>x.id===id);
  if(!e || e.reversedBy || !OPPOSITE[e.kind]) return;
  const r = addEntry({ kind:OPPOSITE[e.kind], amount:e.amount, qty:e.qty, itemId:e.itemId,
    customerId:e.customerId, category:e.category, method:e.method,
    note:(e.note?e.note+" — ":"")+t("corrected"), reverses:e.id });
  e.reversedBy = r.id;
  commit("correct","#"+e.id.slice(-4));
  toast(t("saved"));
}
/* Die Nummer wurde hochgezaehlt, bevor feststand, dass gespeichert werden kann.
   Schlug das Schreiben fehl, war sie verbraucht und die naechste Rechnung trug
   dieselbe. Jetzt zaehlt nur ein geglueckter Schreibvorgang hoch. */
function peekBillNo(){

};

let toastT;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"),2200);
}
async function copy(text,msg){
  try{ await navigator.clipboard.writeText(text); toast(msg||t("copied")); }
  catch(e){
    openSheet(t("copy_msg"), '<textarea class="inp" rows="7" id="copy-fallback">'+esc(text)+'</textarea>');
    setTimeout(()=>{ const ta=$("#copy-fallback"); if(ta){ta.focus();ta.select();} },60);
  }
}
function waLink(phone,text){
  const n = String(phone||"").replace(/[^0-9]/g,"").replace(/^0/,"94");
  return "https://wa.me/"+n+"?text="+encodeURIComponent(text);
}

/* ---------- sheet ---------- */
let sheetFoot = null;
function openSheet(title,html,footHtml){
  $("#sheet-title").innerHTML = title;
  $("#sheet-body").innerHTML = html;
  const f = $("#sheet-foot");
  if(footHtml){ f.innerHTML = footHtml; f.classList.remove("hide"); }
  else { f.innerHTML = ""; f.classList.add("hide"); }
  $("#scrim").classList.remove("hide"); $("#sheet").classList.remove("hide");
  requestAnimationFrame(()=>{ $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); });
}
function closeSheet(){
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  setTimeout(()=>{ $("#scrim").classList.add("hide"); $("#sheet").classList.add("hide"); },200);
}
$("#sheet-x").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#sheet").classList.contains("hide")) closeSheet(); });

function confirmSheet(title,body,okLabel,onOk,danger){
  openSheet(esc(title), '<p style="margin:0 0 4px;color:var(--ink-2)">'+esc(body)+'</p>',
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn '+(danger?"danger":"")+'" id="confirm-ok">'+esc(okLabel)+'</button>');
  $("#confirm-ok").onclick = ()=>{ closeSheet(); onOk(); };
}

/* ---------- routing ---------- */
let view = {name:"home"};
function go(name,arg){ view = {name,arg}; window.scrollTo(0,0); $("#main").scrollTop=0; render(); }

/* ---------- small builders ---------- */
function hero(label,value,note,tone){
  return '<div class="hero '+(tone||"")+'"><div class="hero-label">'+esc(label)+'</div>'+
    '<div class="hero-num"><small>Rs</small>'+esc(money(value,{bare:true}))+'</div>'+
    (note?'<div class="hero-note">'+note+'</div>':'')+'</div>';
}
function stat(k,v,tone){
  return '<div class="stat"><div class="stat-k">'+esc(k)+'</div>'+
    '<div class="stat-v" style="'+(tone?"color:var(--"+tone+")":"")+'">'+v+'</div></div>';
}
function emptyBox(icon,title,text){
  return '<div class="list"><div class="empty">'+icon+'<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p></div></div>';
}
function initials(n){
  const w = String(n||"").split(/[\s\u2014\u2013-]+/).filter(x=>/^[\p{L}\p{N}]/u.test(x));
  return (w.slice(0,2).map(x=>x[0]).join("")||"?").toUpperCase();
}
function field(label,inner){
  return '<label class="f"><span class="f-l">'+label+'</span>'+inner+'</label>';
}
function amtField(id,ph){
  return field(t("amount"),'<input class="inp amt" id="'+id+'" inputmode="decimal" placeholder="'+(ph||"0")+'">');
}
function segment(id,opts,active){
  return '<div class="seg" id="'+id+'">'+opts.map(o=>
    '<button data-v="'+o.v+'" aria-pressed="'+(o.v===active)+'">'+esc(o.label)+'</button>').join("")+'</div>';
}
</script>

<script>

      field(t("owner_name"),'<input class="inp" id="s-owner" placeholder="—">')+
      '<div><span class="f-l">'+t("biz_type")+'</span><div class="chips" id="s-types">'+
        L().types.map((x,i)=>'<button class="chip" data-type="'+i+'" aria-pressed="'+(i===0)+'">'+esc(x)+'</button>').join("")+

      '<p style="text-align:center;color:var(--ink-2);margin:0">'+esc(t("enter_pin"))+'</p>'+
      '<div class="pin-dots">'+[0,1,2,3].map(i=>'<div class="pin-dot'+(pinBuf.length>i?" on":"")+'"></div>').join("")+'</div>'+
      '<div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-pin="'+n+'">'+n+'</button>').join("")+
        '<button data-pin="del">←</button><button data-pin="0">0</button><button data-pin="clr">✕</button></div>';

/* ============================ shell ============================ */
const TABS = [
  {k:"home",   i:I.home},
  {k:"credit", i:I.credit},
  {k:"cash",   i:I.cash},
  {k:"stock",  i:I.stock},
  {k:"bills",  i:I.bills}
];
const tabsNow = () => TABS.filter(x => x.k !== "stock" || !isService());
function renderShell(){
  $("#auth").classList.add("hide");
  ["#topbar","#main","#tabbar"].forEach(s=>$(s).classList.remove("hide"));

  $("#topbar").innerHTML =
    '<button class="biz" data-act="switch-biz">'+
      '<span class="biz-mark">'+esc(initials(b.name))+'</span>'+

    '</button>'+
    '<button class="icon-btn" data-act="team" aria-label="'+esc(t("team").replace(/&amp;/g,"&"))+'">'+I.users+'</button>'+
    '<button class="icon-btn" data-act="settings" aria-label="'+esc(t("settings"))+'">'+I.gear+'</button>';

function renderFab(){
  const f = $("#fab");
  const map = { credit:["new-cust",t("new_customer")], cash:["new-cash",t("add_entry")],
                stock:["new-item",t("new_item")], bills:["newbill",t("new_bill")] };
  const cfg = map[view.name];
  if(cfg && canWrite()){
    f.classList.remove("hide");
    f.dataset.act = cfg[0];
    f.innerHTML = I.plus+'<span>'+esc(cfg[1])+'</span>';
  } else f.classList.add("hide");

/* ============================ home ============================ */
function entryLine(e){
  const cust = e.customerId ? DB.customers.find(c=>c.id===e.customerId) : null;
  const it = e.itemId ? DB.items.find(i=>i.id===e.itemId) : null;
  const mem = DB.members.find(m=>m.id===e.byMemberId);
  const tone = (e.kind==="cash_in") ? "in" : (e.kind==="cash_out") ? "out"
    : (e.kind==="credit_give") ? "owed" : (e.kind==="credit_take") ? "in" : "";
  const title = cust ? cust.name : it ? it.name : t(e.category||e.kind);
  const kindTxt = { credit_give:t("give_credit"), credit_take:t("take_payment"),
    cash_in:t("money_in"), cash_out:t("money_out"),
    stock_in:t("stock_in"), stock_out:t("stock_out"), transfer:t("to_bank") }[e.kind] || e.kind;
  const amt = (e.kind==="stock_in"||e.kind==="stock_out")
    ? esc(e.qty+" "+(it?.unit||t("pcs")))
    : esc(money(e.amount));
  return '<button class="row" data-entry="'+e.id+'">'+
    '<span class="av">'+esc(initials(title))+'</span>'+
    '<span class="row-main"><span class="row-t">'+esc(title)+
      (e.reversedBy?' <span class="pill">'+esc(t("corrected"))+'</span>':'')+'</span>'+
      '<span class="row-s">'+esc(kindTxt)+(e.note?" · "+esc(e.note):"")+
      (mem?' · '+esc(t("by"))+' '+esc(mem.name.split(" ")[0]):'')+'</span></span>'+
    '<span class="row-end"><span class="row-amt '+tone+'">'+amt+'</span>'+
      '<span class="row-sub">'+esc(dayLabel(e.day,DB.settings.lang))+' '+timeLabel(e.ts, e)+'</span></span>'+
  '</button>';
}

function screenHome(){
  const today = [localDay()];
  const flow = cashFlow(e=>e.day===localDay());
  const low = lowItems();
  const owing = customers().filter(c=>custBalance(c.id)>0);
  const recent = entriesVisible().slice(0,6);
  let h = "";
  h += hero(t("in_drawer"), cashInHand(),
    '<span class="num">'+money(flow.in,{bare:true})+'</span> '+esc(t("money_in"))+
    ' · <span class="num">'+money(flow.out,{bare:true})+'</span> '+esc(t("money_out"))+
    ' — '+esc(t("today")), "brand");
  const bank = bankBalance();
  h += '<div class="grid2">'+
    (bank !== 0 ? stat(t("in_bank"), money(bank), "brand")
                : stat(t("owed_to_you"), money(totalOwed()), "owed"))+
    stat(t("todays_sales"), money(salesIn(today)), "in")+
    (bank !== 0 ? stat(t("owed_to_you"), money(totalOwed()), "owed") : "")+
    stat(t("customers"), owing.length+" / "+customers().length)+
    (isService()
      ? stat(t("money_out"), money(flow.out), "out")
      : stat(t("low_stock"), String(low.length), low.length?"out":null))+
  '</div>';
  /* Every competitor capped the basics in 2026 and their newest one-star
     reviews are all about it. Saying this plainly, in the shop owner's own
     language, is the product's whole position. */
  if(!DB.settings.freeSeen){
    h += '<div class="promise">'+
      '<h3>'+esc(t("free_title"))+'</h3>'+
      '<p>'+esc(t("free_1"))+'</p>'+
      '<p>'+esc(t("free_2"))+'</p>'+
      '<p class="langs">'+esc(t("free_3"))+'</p>'+
      '<div class="btn-row" style="margin-top:12px">'+
        '<button class="btn ghost sm" data-act="ideas" style="flex:1">'+esc(t("free_more"))+'</button>'+
        '<button class="btn sm" data-act="free-ok" style="flex:0 0 96px">'+esc(t("free_ok"))+'</button>'+
      '</div></div>';
  }
  const qi = quickItems();
  if(qi.length || isService()){
    h += '<div class="sec-head"><h2>'+esc(t("quick"))+'</h2></div>';
    if(qi.length){
      h += segment("quick-mode",[{v:"cash",label:t("pay_cash")},{v:"credit",label:t("pay_credit")}],quickMode);
      h += '<div class="qgrid">'+qi.map(i=>
        '<button class="qbtn" data-act="quick" data-id="'+i.id+'">'+
        '<span>'+esc(i.name)+'</span><b>'+esc(money(i.price,{bare:true}))+'</b></button>').join("")+'</div>';
    } else {
      h += emptyBox(I.cash,t("quick_none"),t("quick_none_p"));
      h += '<button class="btn soft" data-act="new-item">'+esc(t("quick_add"))+'</button>';
    }
  }
  if(low.length && !isService()){
    h += '<button class="warn" data-go="stock">'+
      I.warn+' '+esc(low.slice(0,3).map(i=>i.name).join(", "))+
      (low.length>3?" +"+(low.length-3):"")+'</button>';
  }
  h += '<div class="sec-head"><h2>'+esc(t("recent"))+'</h2>'+
    (recent.length?'<button class="link" data-go="cash">'+esc(t("see_all"))+'</button>':'')+'</div>';
  h += recent.length
    ? '<div class="list">'+recent.map(entryLine).join("")+'</div>'
    : emptyBox(I.book,t("no_entries"),t("no_entries_p"));
  if(!seesAll()) h += '<div class="note">'+esc(t("role_counter_d"))+'</div>';
  return h;
}

/* ============================ credit book ============================ */
function screenCredit(){
  const open = seesAll();
  const list = customers().map(c=>({c,bal:open?custBalance(c.id):0}))
    .sort((a,b)=> open ? b.bal-a.bal : a.c.name.localeCompare(b.c.name));
  let h = open
    ? hero(t("owed_to_you"), totalOwed(),
        list.filter(x=>x.bal>0).length+" "+esc(t("owing"))+" · "+list.length+" "+esc(t("customers")),"owed")
    : '<div class="note">'+esc(t("role_counter_d"))+'</div>';
  if(!list.length) return h + emptyBox(I.credit,t("no_cust"),t("no_cust_p"));
  h += '<div class="list">'+list.map(({c,bal})=>
    '<button class="row" data-cust="'+c.id+'">'+
      '<span class="av">'+esc(initials(c.name))+'</span>'+
      '<span class="row-main"><span class="row-t">'+esc(c.name)+'</span>'+
        '<span class="row-s">'+esc(c.phone||t("optional"))+'</span></span>'+
      '<span class="row-end">'+(!open ? ''
        : bal>0 ? '<span class="row-amt owed">'+esc(money(bal))+'</span>'
        : '<span class="pill in">'+esc(t("settled"))+'</span>')+'</span>'+
    '</button>').join("")+'</div>';
  return h;
}

function screenCustomer(id){
  const c = DB.customers.find(x=>x.id===id);
  if(!c) return screenCredit();
  const open = seesAll();
  const bal = custBalance(id);
  const ledger = (open ? entriesAll() : entriesVisible()).filter(e=>e.customerId===id);
  let h = '<button class="btn ghost sm" data-go="credit" style="align-self:flex-start">'+I.back+' '+esc(t("credit"))+'</button>';
  if(!open) h += '<div class="hero"><div class="hero-label">'+esc(c.name)+'</div>'+
      '<div class="hero-note" style="margin-top:8px">'+esc(t("role_counter_d"))+'</div></div>';
  else h += hero(c.name+" · "+t("balance"), bal,
    esc(t("cust_since"))+" "+esc(dayLabel(c.day||localDay(),DB.settings.lang))+
    (c.phone?' · <span class="num">'+esc(c.phone)+'</span>':''),
    bal>0?"owed":"in");
  if(canWrite()) h += '<div class="btn-row">'+
    '<button class="btn soft" data-act="give" data-id="'+id+'">'+esc(t("give_credit"))+'</button>'+
    '<button class="btn" data-act="take" data-id="'+id+'">'+esc(t("take_payment"))+'</button></div>';
  if(open && bal>0 && c.phone) h += '<div class="btn-row">'+
    '<a class="btn ghost" href="'+esc(waLink(c.phone,reminderText(c,bal)))+'" target="_blank" rel="noopener">'+I.wa+' '+esc(t("remind"))+'</a>'+
    '<button class="btn ghost" data-act="copy-remind" data-id="'+id+'" style="flex:0 0 58px" aria-label="'+esc(t("copy_msg"))+'">'+I.copy+'</button></div>';
  h += '<div class="sec-head"><h2>'+esc(t("entry"))+'</h2><span class="link" style="color:var(--ink-3)">'+ledger.length+' '+esc(t("entries"))+'</span></div>';
  h += ledger.length ? '<div class="list">'+ledger.map(entryLine).join("")+'</div>'
    : emptyBox(I.book,t("no_entries"),t("no_entries_p"));
  return h;
}
function reminderText(c,bal){
  return t("reminder_msg").replace("{name}",c.name).replace("{shop}",biz().name).replace("{amt}",money(bal));
}
</script>

<script>
/* ============================ cash book ============================ */
let cashPeriod = "day";
let quickMode = "cash";
const CATS_IN  = ["cat_sales","cat_other_in"];
const CATS_OUT = ["cat_stock","cat_rent","cat_wages","cat_transport","cat_bills","cat_other_out"];

function screenCash(){
  const days = rangeDays(cashPeriod), set = new Set(days);
  const flow = cashFlow(e=>set.has(e.day));
  const rows = entriesVisible().filter(e=>["cash_in","cash_out","transfer"].includes(e.kind) && set.has(e.day));
  /* The hero answers the question the toggle asks. Cash in hand is a
     different question and belongs in the small line. */
  let h = hero(t(cashPeriod)+" · "+t("period_net"), flow.net,
    esc(t("in_drawer"))+' <span class="num">'+money(cashInHand())+'</span>',
    flow.net>=0 ? "in" : "out");
  h += segment("cash-period",[{v:"day",label:t("day")},{v:"week",label:t("week")},{v:"month",label:t("month")}],cashPeriod);
  h += '<div class="grid2">'+stat(t("money_in"),money(flow.in),"in")+stat(t("money_out"),money(flow.out),"out")+
    stat(t("in_drawer"),money(cashInHand()),"brand")+stat(t("in_bank"),money(bankBalance()),"brand")+'</div>';
  h += rows.length ? '<div class="list">'+rows.map(entryLine).join("")+'</div>'
    : emptyBox(I.cash,t("no_entries"),t("no_entries_p"));
  return h;
}

/* ============================ stock book ============================ */
function screenStock(){
  const list = stockItems().map(i=>({i,q:itemQty(i.id)}));
  const days = daysBack(30);
  let h = hero(t("stock_value"), stockValue(),
    list.length+" "+esc(t("items"))+" · "+lowItems().length+" "+esc(t("low_stock")), "brand");
  if(!list.length) return h + emptyBox(I.stock,t("no_items"),t("no_items_p"));
  const best = list.map(x=>({...x,sold:soldQty(x.i.id,days)}))
    .filter(x=>x.sold>0).sort((a,b)=>b.sold-a.sold).slice(0,3);
  if(best.length){
    h += '<div class="sec-head"><h2>'+esc(t("best_sellers"))+'</h2><span class="link" style="color:var(--ink-3)">'+esc(t("month"))+'</span></div>';
    h += '<div class="list">'+best.map(x=>
      '<button class="row" data-item="'+x.i.id+'"><span class="av">'+esc(initials(x.i.name))+'</span>'+
      '<span class="row-main"><span class="row-t">'+esc(x.i.name)+'</span>'+
      '<span class="row-s">'+x.sold+' '+esc(x.i.unit||t("pcs"))+' '+esc(t("sold"))+'</span></span>'+
      '<span class="row-end"><span class="row-amt in">'+esc(money(x.sold*(x.i.price-(x.i.cost||0))))+'</span>'+
      '<span class="row-sub">'+esc(t("profit"))+'</span></span></button>').join("")+'</div>';
  }
  h += '<div class="sec-head"><h2>'+esc(t("stock"))+'</h2></div>';
  h += '<div class="list">'+list.sort((a,b)=>a.q-b.q).map(({i,q})=>{
    const low = q <= (i.lowAt??0);
    return '<button class="row" data-item="'+i.id+'">'+
      '<span class="av"'+(low?' style="background:var(--out-soft);color:var(--out)"':'')+'>'+esc(initials(i.name))+'</span>'+
      '<span class="row-main"><span class="row-t">'+esc(i.name)+
        (low?' <span class="pill out">'+esc(t("low_stock"))+'</span>':'')+'</span>'+
        '<span class="row-s">'+esc(money(i.price))+' · '+esc(t("cost"))+' '+esc(money(i.cost||0))+'</span></span>'+
      '<span class="row-end"><span class="row-amt '+(low?"out":"")+'">'+q+'</span>'+
        '<span class="row-sub">'+esc(i.unit||t("pcs"))+' '+esc(t("in_stock"))+'</span></span></button>';
  }).join("")+'</div>';
  return h;
}

function screenItem(id){
  const i = DB.items.find(x=>x.id===id);
  if(!i) return screenStock();
  const q = itemQty(id), days = daysBack(30);
  const moves = entriesAll().filter(e=>e.itemId===id);
  const sold = soldQty(id,days);
  const marg = i.price ? Math.round((i.price-(i.cost||0))/i.price*100) : 0;
  let h = '<button class="btn ghost sm" data-go="stock" style="align-self:flex-start">'+I.back+' '+esc(t("stock"))+'</button>';
  h += '<div class="hero '+(q<=(i.lowAt??0)?"out":"brand")+'"><div class="hero-label">'+esc(i.name)+'</div>'+
    '<div class="hero-num">'+q+' <small>'+esc(i.unit||t("pcs"))+'</small></div>'+
    '<div class="hero-note">'+esc(t("low_at"))+' '+(i.lowAt??0)+'</div></div>';
  h += '<div class="grid2">'+stat(t("price"),money(i.price))+stat(t("cost"),money(i.cost||0))+
    stat(t("margin"),marg+"%", marg>0?"in":"out")+stat(t("sold"),sold+" "+esc(i.unit||t("pcs")))+'</div>';
  if(canWrite()) h += '<div class="btn-row">'+
    '<button class="btn soft" data-act="stockin" data-id="'+id+'">'+esc(t("stock_in"))+'</button>'+
    '<button class="btn ghost" data-act="stockout" data-id="'+id+'">'+esc(t("stock_out"))+'</button></div>';
  h += '<div class="btn-row"><button class="btn ghost sm" data-act="edit-item" data-id="'+id+'" style="flex:1">'+esc(t("edit_item"))+'</button></div>';
  h += '<div class="sec-head"><h2>'+esc(t("history"))+'</h2></div>';
  h += moves.length ? '<div class="list">'+moves.map(entryLine).join("")+'</div>'
    : emptyBox(I.book,t("no_entries"),t("no_entries_p"));
  return h;
}

/* ============================ bills ============================ */
let draft = null;

function screenBills(){
  const list = invoices();
  const days = daysBack(30);
  let h = hero(t("todays_sales"), salesIn([localDay()]),
    esc(t("profit"))+' <span class="num">'+money(profitIn(days))+'</span> '+esc(t("profit_bills"))+' · '+esc(t("month")),"in");
  if(!list.length) return h + emptyBox(I.bills,t("no_bills"),t("no_bills_p"));
  h += '<div class="list">'+list.map(inv=>{
    const c = inv.customerId ? DB.customers.find(x=>x.id===inv.customerId) : null;
    const pill = inv.method==="credit" ? '<span class="pill owed">'+esc(t("pay_credit"))+'</span>'
      : inv.method==="qr" ? '<span class="pill brand">'+esc(t("pay_qr"))+'</span>'
      : '<span class="pill in">'+esc(t("pay_cash"))+'</span>';
    return '<button class="row" data-bill="'+inv.id+'">'+
      '<span class="av">'+esc(inv.no.replace(/[^0-9]/g,"").slice(-3))+'</span>'+
      '<span class="row-main"><span class="row-t">'+esc(inv.no)+' '+pill+'</span>'+
      '<span class="row-s">'+esc(c?c.name:t("pay_cash"))+' · '+inv.lines.length+' '+esc(t("items"))+'</span></span>'+
      '<span class="row-end"><span class="row-amt">'+esc(money(inv.total))+'</span>'+
      '<span class="row-sub">'+esc(dayLabel(inv.day,DB.settings.lang))+'</span></span></button>';
  }).join("")+'</div>';
  return h;
}

function billText(inv){
  const lines = inv.lines.map(l=>l.qty+" × "+l.name+" — "+money(l.qty*l.price)).join("\n");
  return t("bill_msg").replace("{shop}",biz().name).replace("{no}",inv.no)
    .replace("{lines}",lines).replace("{total}",money(inv.total));
}

function screenBill(id){
  const inv = DB.invoices.find(x=>x.id===id);
  if(!inv) return screenBills();
  const b = biz();
  const c = inv.customerId ? DB.customers.find(x=>x.id===inv.customerId) : null;
  const mem = DB.members.find(m=>m.id===inv.byMemberId);
  const sub = inv.lines.reduce((s,l)=>s+l.qty*l.price,0);
  let h = '<button class="btn ghost sm" data-go="bills" style="align-self:flex-start">'+I.back+' '+esc(t("bills"))+'</button>';
  h += '<div class="bill"><div class="bill-top"><h3>'+esc(b.name)+'</h3>'+
    '<p>'+esc(b.address||L().types[b.typeIx||0])+(b.phone?' · '+esc(b.phone):'')+'</p></div>'+
    '<div class="bill-meta"><span>'+esc(t("bill_no"))+' <b class="num">'+esc(inv.no)+'</b></span>'+
    '<span class="num">'+esc(dayLabel(inv.day,DB.settings.lang))+' '+timeLabel(inv.ts)+'</span></div>'+
    (c?'<div class="bill-meta"><span>'+esc(c.name)+'</span><span class="num">'+esc(c.phone||"")+'</span></div>':'')+
    '<div>'+inv.lines.map(l=>'<div class="bill-line"><span class="q">'+l.qty+'×</span>'+
      '<span class="n">'+esc(l.name)+'<br><span style="font-size:11.5px;color:var(--ink-3)" class="num">'+money(l.price)+'</span></span>'+
      '<span class="p">'+esc(money(l.qty*l.price))+'</span></div>').join("")+'</div>'+
    '<div class="bill-sum">'+
      '<div><span>'+esc(t("total"))+'</span><span class="num">'+esc(money(sub))+'</span></div>'+
      (inv.discount>0?'<div><span>'+esc(t("discount"))+'</span><span class="num">−'+esc(money(inv.discount))+'</span></div>':'')+
      '<div class="tot"><span>'+esc(t("total"))+'</span><span class="num">'+esc(money(inv.total))+'</span></div>'+
      '<div style="margin-top:6px"><span style="color:var(--ink-3)">'+esc(t("paid_how"))+'</span>'+
      '<span>'+esc(t(inv.method==="credit"?"pay_credit":inv.method==="qr"?"pay_qr":"pay_cash"))+'</span></div>'+
    '</div>'+
    '<div class="bill-foot">'+esc(t("thanks"))+
      (mem?'<br>'+esc(t("by"))+' '+esc(mem.name):'')+'</div></div>';
  h += '<div class="btn-row">'+
    (c&&c.phone?'<a class="btn" href="'+esc(waLink(c.phone,billText(inv)))+'" target="_blank" rel="noopener">'+I.wa+' '+esc(t("send_wa"))+'</a>':'')+
    '<button class="btn ghost" data-act="copy-bill" data-id="'+id+'">'+I.copy+' '+esc(t("copy_bill"))+'</button></div>';
  return h;
}

function screenNewBill(){
  if(!draft) draft = {lines:[],customerId:"",discount:0,method:"cash"};
  const its = items();
  const sub = draft.lines.reduce((s,l)=>s+l.qty*l.price,0);
  const tot = Math.max(0, sub - Math.min(Math.max(0,draft.discount||0), sub));
  let h = '<button class="btn ghost sm" data-go="bills" style="align-self:flex-start">'+I.back+' '+esc(t("bills"))+'</button>';
  h += hero(t("total"), tot, draft.lines.length+" "+esc(t("items")), "brand");
  if(!its.length) return h + emptyBox(I.stock,t("no_items"),t("no_items_p"));
  h += '<div class="sec-head"><h2>'+esc(t("pick_items"))+'</h2></div>';
  h += draft.lines.length ? '<div class="list">'+draft.lines.map((l,ix)=>
    '<div class="row"><span class="av">'+l.qty+'</span>'+
    '<span class="row-main"><span class="row-t">'+esc(l.name)+'</span>'+
    '<span class="row-s num">'+esc(money(l.price))+' × '+l.qty+'</span></span>'+
    '<span class="row-end"><span class="row-amt">'+esc(money(l.qty*l.price))+'</span></span>'+
    '<button class="icon-btn" data-act="rm-line" data-ix="'+ix+'" aria-label="remove">'+I.trash+'</button></div>').join("")+'</div>' : "";
  h += '<div class="chips">'+its.map(i=>
    '<button class="chip" data-act="add-line" data-id="'+i.id+'">'+esc(i.name)+
    ' <span class="num" style="color:var(--ink-3)">'+money(i.price,{bare:true})+'</span></button>').join("")+'</div>';
  h += '<div class="list" style="padding:13px">'+
    field(t("customers")+' <span style="color:var(--ink-3);font-weight:400">('+t("optional")+')</span>',
      '<select class="inp" id="bill-cust"><option value="">—</option>'+
      customers().map(c=>'<option value="'+c.id+'"'+(draft.customerId===c.id?" selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select>')+
    field(t("discount"),'<input class="inp" id="bill-disc" inputmode="decimal" value="'+(draft.discount||"")+'" placeholder="0">')+
    '<span class="f-l">'+t("paid_how")+'</span>'+
    segment("bill-method",[{v:"cash",label:t("pay_cash")},{v:"credit",label:t("pay_credit")},{v:"qr",label:t("pay_qr")}],draft.method)+
    '</div>';
  h += '<button class="btn" data-act="save-bill"'+(draft.lines.length?"":" disabled")+'>'+esc(t("make_bill"))+'</button>';
  return h;
}
</script>

<script>
/* ============================ sheets: write actions ============================ */
function sheetGive(cid,take){
  const c = DB.customers.find(x=>x.id===cid);
  openSheet(esc(take?t("take_payment"):t("give_credit"))+' · '+esc(c.name),
    amtField("g-amt")+field(t("note")+' <span style="color:var(--ink-3);font-weight:400">('+t("optional")+')</span>',
      '<input class="inp" id="g-note" placeholder="—">'),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" id="g-save">'+t("save")+'</button>');
  setTimeout(()=>$("#g-amt")?.focus(),80);
  $("#g-save").onclick = ()=>{
    const a = parseAmt($("#g-amt").value);
    if(badAmt(a) || a<=0) return toast(t("need_amount"));
    addEntry({kind:take?"credit_take":"credit_give",amount:a,customerId:cid,note:$("#g-note").value.trim()});
    closeSheet(); commit(take?"credit_take":"credit_give",c.name+" "+money(a)); toast(t("saved"));
  };
}
function sheetNewCust(){
  openSheet(t("new_customer"),
    field(t("cust_name"),'<input class="inp" id="c-name" placeholder="—">')+
    field(t("cust_phone")+' <span style="color:var(--ink-3);font-weight:400">('+t("optional")+')</span>',
      '<input class="inp" id="c-phone" inputmode="tel" placeholder="07X XXX XXXX">'),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" id="c-save">'+t("save")+'</button>');
  setTimeout(()=>$("#c-name")?.focus(),80);
  $("#c-save").onclick = ()=>{
    const n = $("#c-name").value.trim();
    if(!n) return toast(t("need_name"));
    const c = {id:uid("c"),bizId:DB.activeBizId,name:n,phone:$("#c-phone").value.trim(),
      ts:Date.now(),day:localDay()};
    DB.customers.push(c); closeSheet(); commit("customer_add",n); toast(t("saved"));
    go("customer",c.id);
  };
}
function sheetCash(){
  let dir = "in", cat = "cat_sales";
  const body = ()=> segment("k-dir",[{v:"in",label:t("money_in")},{v:"out",label:t("money_out")},{v:"bank",label:t("to_bank")}],dir)+
    '<div style="height:12px"></div>'+amtField("k-amt")+
    (dir==="bank"
      ? '<div class="note">'+esc(t("to_bank_d"))+'</div><div style="height:12px"></div>'
      : '<span class="f-l">'+t("category")+'</span><div class="chips" id="k-cats">'+
        (dir==="in"?CATS_IN:CATS_OUT).map(c=>'<button class="chip" data-cat="'+c+'" aria-pressed="'+(c===cat)+'">'+esc(t(c))+'</button>').join("")+
        '</div><div style="height:12px"></div>')+
    field(t("note"),'<input class="inp" id="k-note" placeholder="—">');
  /* Redrawing used to throw away the amount already typed, which silently
     turned a 1200-rupee expense into a blank form. Carry it across. */
  const draw = ()=>{
    const keep = $("#k-amt")?.value || "";
    const note = $("#k-note")?.value || "";
    $("#sheet-body").innerHTML = body();
    if($("#k-amt")) $("#k-amt").value = keep;
    if($("#k-note")) $("#k-note").value = note;
    setTimeout(()=>$("#k-amt")?.focus(),60);
  };
  openSheet(t("add_entry"), body(),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" id="k-save">'+t("save")+'</button>');
  setTimeout(()=>$("#k-amt")?.focus(),80);
  /* onclick, not addEventListener: #sheet-body survives reopening, so a listener
     would stack up and a stale closure would redraw with the old direction */
  $("#sheet-body").onclick = ev=>{
    const d = ev.target.closest("[data-v]"), cc = ev.target.closest("[data-cat]");
    if(d && d.parentElement.id==="k-dir"){ dir = d.dataset.v; cat = dir==="in"?"cat_sales":"cat_stock"; draw(); }
    if(cc){ cat = cc.dataset.cat; [...$("#k-cats").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===cat)); }
  };
  $("#k-save").onclick = ()=>{
    const a = parseAmt($("#k-amt").value);
    if(badAmt(a) || a<=0) return toast(t("need_amount"));
    if(dir==="bank") addEntry({kind:"transfer",amount:a,note:$("#k-note").value.trim()||t("to_bank")});
    else addEntry({kind:dir==="in"?"cash_in":"cash_out",amount:a,category:cat,
      acct:"cash",note:$("#k-note").value.trim()});
    closeSheet(); commit(dir==="bank"?"transfer":dir==="in"?"cash_in":"cash_out",money(a)); toast(t("saved"));
  };
}
function sheetItem(existing){
  const i = existing ? DB.items.find(x=>x.id===existing) : null;
  openSheet(i?esc(i.name):t("new_item"),
    field(t("item_name"),'<input class="inp" id="i-name" value="'+esc(i?.name||"")+'" placeholder="—">')+
    field(t("unit"),'<input class="inp" id="i-unit" value="'+esc(i?.unit||"")+'" placeholder="'+esc(t("pcs"))+'">')+
    field(t("cost"),'<input class="inp" id="i-cost" inputmode="decimal" value="'+(i?.cost??"")+'" placeholder="0">')+
    field(t("price"),'<input class="inp" id="i-price" inputmode="decimal" value="'+(i?.price??"")+'" placeholder="0">')+
    '<div class="chips" style="margin-bottom:12px">'+
      '<button class="chip" id="i-tracked" aria-pressed="'+(i?isTracked(i):!isService())+'">'+esc(t("tracked"))+'</button>'+
      '<button class="chip" id="i-quick" aria-pressed="'+(i?!!i.quick:isService())+'">'+esc(t("quick"))+'</button>'+
    '</div>'+
    '<div id="i-stockfields">'+
      field(t("low_at"),'<input class="inp" id="i-low" inputmode="numeric" value="'+(i?.lowAt??5)+'">')+
      (i?"":field(t("qty"),'<input class="inp" id="i-qty" inputmode="decimal" placeholder="0">'))+
    '</div>',
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" id="i-save">'+t("save")+'</button>');
  setTimeout(()=>$("#i-name")?.focus(),80);
  const syncStockFields = ()=>{
    const on = $("#i-tracked").getAttribute("aria-pressed")==="true";
    $("#i-stockfields").classList.toggle("hide", !on);
  };
  syncStockFields();
  $("#i-tracked").onclick = e=>{
    const on = e.currentTarget.getAttribute("aria-pressed")!=="true";
    e.currentTarget.setAttribute("aria-pressed", on); syncStockFields();
  };
  $("#i-quick").onclick = e=>{
    e.currentTarget.setAttribute("aria-pressed", e.currentTarget.getAttribute("aria-pressed")!=="true");
  };
  $("#i-save").onclick = ()=>{
    const n = $("#i-name").value.trim();
    if(!n) return toast(t("need_name"));
    const trk = $("#i-tracked").getAttribute("aria-pressed")==="true";
    const cost = parseAmt($("#i-cost").value), price = parseAmt($("#i-price").value);
    const low = parseAmt($("#i-low").value);
    if(badAmt(cost) || badAmt(price) || badAmt(low)) return toast(t("need_amount"));
    const o = {name:n,unit:$("#i-unit").value.trim()||t("pcs"),
      cost, price, lowAt:low,
      tracked:trk, quick:$("#i-quick").getAttribute("aria-pressed")==="true"};
    if(i){ Object.assign(i,o); closeSheet(); commit("item_edit",n); }
    else {
      const it = Object.assign({id:uid("i"),bizId:DB.activeBizId,ts:Date.now(),day:localDay()},o);
      DB.items.push(it);
      const q0 = trk ? parseAmt($("#i-qty").value) : 0;
      const q = badAmt(q0) ? 0 : q0;
      if(q>0) addEntry({kind:"stock_in",qty:q,itemId:it.id,note:t("stock_in")});
      closeSheet(); commit("item_add",n);
      go(trk ? "item" : "home");
    }
    toast(t("saved"));
  };
}
function sheetStockMove(id,out){
  const i = DB.items.find(x=>x.id===id);
  openSheet(esc(out?t("stock_out"):t("stock_in"))+' · '+esc(i.name),
    field(t("qty")+" ("+esc(i.unit||t("pcs"))+")",'<input class="inp amt" id="m-qty" inputmode="decimal" placeholder="0">')+
    field(t("note"),'<input class="inp" id="m-note" placeholder="—">'),
    '<button class="btn ghost" data-act="close">'+t("cancel")+'</button>'+
    '<button class="btn" id="m-save">'+t("save")+'</button>');
  setTimeout(()=>$("#m-qty")?.focus(),80);
  $("#m-save").onclick = ()=>{
    const q = parseAmt($("#m-qty").value);
    if(badAmt(q) || q<=0) return toast(t("need_amount"));
    const note = $("#m-note").value.trim();
    const write = ()=>{
      addEntry({kind:out?"stock_out":"stock_in",qty:q,itemId:id,note});
      closeSheet(); commit(out?"stock_out":"stock_in",i.name+" "+q); toast(t("saved"));
    };
    /* One mistyped zero quietly wrecks the count. Ask, do not block:
       a shop really can sell stock it never booked in. */
    const held = itemQty(id);
    if(out && q > held) confirmSheet(t("stock_out")+" · "+i.name,
      t("more_than_held").replace("{held}", held+" "+(i.unit||t("pcs"))), t("save"), write);
    else write();
  };
}

/* one bill moves cash, credit and stock together — the thing Shopbook's
   reviewers complain about ("cash sales not hitting the cash book") */
function saveBill(){
  const sub = draft.lines.reduce((s,l)=>s+l.qty*l.price,0);
  /* A discount is a reduction, never an increase, and never more than the
     bill. Typing -1000 used to raise a 1,340 bill to 2,340 and book the cash. */
  const disc = Math.min(Math.max(0, draft.discount||0), sub);
  const total = Math.round(sub - disc);
  const inv = {id:uid("v"),bizId:DB.activeBizId,no:peekBillNo(),ts:Date.now(),day:localDay(),
    byMemberId:DB.activeMemberId,customerId:draft.customerId||null,
    lines:draft.lines.map(l=>({...l,
      cost:(DB.items.find(i=>i.id===l.itemId)?.cost)||0})),
    discount:disc,total,method:draft.method};
  DB.invoices.push(inv);
  for(const l of inv.lines){
    const it = DB.items.find(i=>i.id===l.itemId);
    if(it && isTracked(it))
      addEntry({kind:"stock_out",qty:l.qty,itemId:l.itemId,invoiceId:inv.id,note:inv.no});
  }
  if(inv.method==="credit" && inv.customerId)
    addEntry({kind:"credit_give",amount:total,customerId:inv.customerId,invoiceId:inv.id,note:inv.no});
  else
    addEntry({kind:"cash_in",amount:total,category:"cat_sales",method:inv.method,
      acct: inv.method==="qr" ? "bank" : "cash", invoiceId:inv.id,note:inv.no});
  burnBillNo();
  draft = null;
  if(!commit("bill",inv.no+" "+money(total))){
    /* nichts ist auf der Platte gelandet: Nummer zurueckgeben */
    const b = biz(); b.nextBill = Math.max(1,(b.nextBill||2) - 1);
    return;
  }
  toast(t("bill_saved")); go("bill",inv.id);
}

/* ============================ sheets: read / admin ============================ */
function sheetSwitchBiz(){
  openSheet(t("switch_biz"),
    '<div class="list">'+DB.businesses.map(b=>
      '<button class="row" data-biz="'+b.id+'"><span class="av">'+esc(initials(b.name))+'</span>'+
      '<span class="row-main"><span class="row-t">'+esc(b.name)+'</span>'+
